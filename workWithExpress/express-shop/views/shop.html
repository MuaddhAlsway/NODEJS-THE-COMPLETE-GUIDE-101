<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Express Shop</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Express Shop</a>

      <nav>
        <a href="/">Shop</a>
        <a href="/products">Products</a>
        <a href="/admin/add-product">Add product</a>
      </nav>
    </header>

    <main class="card">
      <p class="eyebrow">Express practice project</p>
      <h1>Welcome to the shop</h1>
      <p>
        Add products through the admin form, then view them in the products
        list.
      </p>

      <div class="actions">
        <a class="button" href="/products">View products</a>
        <a class="button button-secondary" href="/admin/add-product">
          Add a product
        </a>
      </div>
    </main>
  </body>
</html>
